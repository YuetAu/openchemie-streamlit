[project]
name = "openchemie-streamlit"
version = "0.1.0"
description = "Streamlit frontend for running OpenChemIE PDF extraction methods"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.44.0",
  "pypdf>=6.10.2",
  "openchemie",
  "numpy<2",
  "torch==1.13.1",
  "torchvision==0.14.1",
  "transformers==4.30.2",
  "huggingface-hub>=0.36.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.uv.sources]
openchemie = { git = "https://github.com/CrystalEye42/OpenChemIE" }
